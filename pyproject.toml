[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PlanTUS"
version = "0.1.1"
authors = [
  { name="Maximilian Lueckel", email="mlueckel@uni-mainz.de" },
]
description = "Tool for heuristic planning of TUS transducer placements"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "nibabel",
  "nilearn",
  "numpy",
  "pynput",
  "PyQt5",
  "vtk",
  "PyYAML"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.hatch.version]
path = "src/PlanTUS/__init__.py"

[project.scripts]
plantus = "PlanTUS.PlanTUS_cli:main"
imagetransform_4kplan = "PlanTUS.ImageTransform_4kPlan:main"

[project.optional-dependencies]
imagetransform = [
  "antspyx",
  "bids_validator"
]

[project.urls]
Homepage = "https://github.com/mlueckel/PlanTUS"
Issues = "https://github.com/mlueckel/PlanTUS/issues"
